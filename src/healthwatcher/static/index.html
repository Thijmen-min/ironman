<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthWatcher</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M3 17h6l3-7 4 13 4-17 3 11h6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>HealthWatcher</span>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#home" data-view="home">Home</a>
    <a href="#calendar" data-view="calendar">Calendar</a>
    <a href="#dashboard" data-view="dashboard">Dashboard</a>
    <a href="#coach" data-view="coach">Coach</a>
  </nav>
  <div class="topbar-right">
    <span class="sync-pill" id="syncPill" title="Sync status"><span class="dot"></span><span id="syncText">-</span></span>
    <button class="btn-top" id="syncBtn" title="Sync Garmin + Strava now">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sync
    </button>
    <a class="btn-top icon" href="#settings" data-view="settings" title="Settings &amp; connections">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </a>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <section id="view-home" class="view" hidden></section>
  <section id="view-calendar" class="view" hidden></section>
  <section id="view-dashboard" class="view" hidden></section>
  <section id="view-coach" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog">
  <div class="drawer-head">
    <div id="drawerTitle"></div>
    <button class="btn-ghost" id="drawerClose" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<div class="tooltip" id="tooltip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>
